# Version of every org.jtaccuino artifact used by the lab.
#
# This file is the single source of truth. It is read by:
#   * tools/make_notebooks.java   (the addDependency("...") lines)
#   * tools/verify_notebooks.java (the classpaths for the generated FX programs)
#   * tools/package_m2.java       (the dependency list of the offline bundle)
#   * tools/render_narrative.java (the version shown on the slides)
#
# tools/cp/*.java cannot read it - jbang parses those files directly, with no
# templating - so they carry the same value literally. Bump both places together;
# tools/check_versions.java fails the build if they drift.

gog4j.version=0.5.0

# GitHub Packages, where the gog4j releases are published
gog4j.repo.url=https://maven.pkg.github.com/jtaccuino/gog4j

# The ML library used by Zoran's stream; shipped in the offline bundle
deepnetts.version=4.0.1
